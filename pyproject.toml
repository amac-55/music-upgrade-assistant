[project]
name = "music-upgrade-assistant"
version = "0.1.0"
description = "Match and replace low-bitrate QuodLibet library tracks with 320kbps/FLAC upgrades, with human-approved batch review."
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.47",
    "rapidfuzz>=3.9",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# GTK4/PyGObject is deliberately NOT listed as a pip dependency: on Debian/
# Ubuntu it's a compiled system package (python3-gi + gir1.2-gtk-4.0) meant
# to be picked up from a --system-site-packages venv. Pulling it from PyPI
# instead would try to compile PyGObject from source against whatever's on
# the box, which usually isn't set up for it. Install it with:
#   sudo apt-get install python3-gi gir1.2-gtk-4.0

[project.scripts]
music-upgrade = "musicupgrade.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
